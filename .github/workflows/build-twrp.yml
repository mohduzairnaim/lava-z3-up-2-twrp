name: Build TWRP for Lava Z3 UP 2

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile TWRP 11
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 repo aria2

      - name: Sync TWRP 11 Source
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd ~/twrp
          git clone https://github.com/twrpdtgen/android_device_lava_Z3_UP_2.git device/lava/Z3_UP_2

      - name: Build TWRP
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_Z3_UP_2-eng
          mka bootimage -j$(nproc --all)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Lava-Z3-UP-2
          path: ~/twrp/out/target/product/Z3_UP_2/boot.img

